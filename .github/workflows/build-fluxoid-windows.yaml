name: build fluxoid windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or commit SHA)
        required: false
        default: alpha-0.4
        type: string

permissions:
  contents: write

jobs:
  build-gateway-windows:
    name: Build Gateway (Windows)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'alpha-0.4' }}

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'

      - name: Install rebar3
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://s3.amazonaws.com/rebar3/rebar3" -OutFile "$env:TEMP\rebar3"
          escript "$env:TEMP\rebar3" local install
          echo "$env:USERPROFILE\.cache\rebar3\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build gateway release
        working-directory: fluxer_gateway
        shell: pwsh
        run: |
          (Get-Content rebar.config) -replace '{include_erts, false}', '{include_erts, true}' | Set-Content rebar.config
          $env:REBAR_SKIP_PROJECT_PLUGINS = '1'
          rebar3 as prod release

      - name: Upload gateway artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxer-gateway-windows-x64
          path: fluxer_gateway/_build/prod/rel/fluxer_gateway/**
          retention-days: 7

  download-bins-windows:
    name: Download Windows Binaries
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'alpha-0.4' }}

      - name: Download binaries
        shell: pwsh
        run: |
          $BinDir = "windows\bin"
          New-Item -ItemType Directory -Force -Path $BinDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$BinDir\node" | Out-Null

          Write-Host "Downloading Caddy..."
          $caddyRel = (Invoke-RestMethod "https://api.github.com/repos/caddyserver/caddy/releases/latest").tag_name
          $caddyVer = $caddyRel.TrimStart('v')
          Invoke-WebRequest -Uri "https://github.com/caddyserver/caddy/releases/download/$caddyRel/caddy_${caddyVer}_windows_amd64.zip" -OutFile "$env:TEMP\caddy.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\caddy.zip" -DestinationPath $BinDir -Force

          Write-Host "Downloading NATS..."
          $natsRel = (Invoke-RestMethod "https://api.github.com/repos/nats-io/nats-server/releases/latest").tag_name
          Invoke-WebRequest -Uri "https://github.com/nats-io/nats-server/releases/download/$natsRel/nats-server-$natsRel-windows-amd64.zip" -OutFile "$env:TEMP\nats.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\nats.zip" -DestinationPath "$env:TEMP\nats" -Force
          Copy-Item (Get-ChildItem "$env:TEMP\nats" -Filter "nats-server.exe" -Recurse | Select-Object -First 1).FullName "$BinDir\nats-server.exe"

          Write-Host "Downloading Meilisearch..."
          $meiliRel = (Invoke-RestMethod "https://api.github.com/repos/meilisearch/meilisearch/releases/latest").tag_name
          Invoke-WebRequest -Uri "https://github.com/meilisearch/meilisearch/releases/download/$meiliRel/meilisearch-windows-amd64.exe" -OutFile "$BinDir\meilisearch.exe" -UseBasicParsing

          Write-Host "Downloading LiveKit..."
          $livekitRel = (Invoke-RestMethod "https://api.github.com/repos/livekit/livekit/releases/latest").tag_name
          $livekitVer = $livekitRel.TrimStart('v')
          Invoke-WebRequest -Uri "https://github.com/livekit/livekit/releases/download/$livekitRel/livekit_${livekitVer}_windows_amd64.zip" -OutFile "$env:TEMP\livekit.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\livekit.zip" -DestinationPath "$env:TEMP\livekit" -Force
          Copy-Item (Get-ChildItem "$env:TEMP\livekit" -Filter "livekit-server.exe" -Recurse | Select-Object -First 1).FullName "$BinDir\livekit-server.exe"

          Write-Host "Downloading Valkey..."
          $valkeyRel = (Invoke-RestMethod "https://api.github.com/repos/valkey-io/valkey/releases/latest").tag_name
          $valkeyVer = $valkeyRel.TrimStart('v')
          Invoke-WebRequest -Uri "https://github.com/valkey-io/valkey/releases/download/$valkeyRel/valkey-${valkeyVer}-windows-x86_64.zip" -OutFile "$env:TEMP\valkey.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\valkey.zip" -DestinationPath "$env:TEMP\valkey" -Force
          Copy-Item (Get-ChildItem "$env:TEMP\valkey" -Filter "valkey-server.exe" -Recurse | Select-Object -First 1).FullName "$BinDir\valkey-server.exe"

          Write-Host "Downloading Node.js..."
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.11.0/node-v20.11.0-win-x64.zip" -OutFile "$env:TEMP\node.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\node.zip" -DestinationPath "$env:TEMP\nodeextract" -Force
          Copy-Item -Recurse -Force (Get-ChildItem "$env:TEMP\nodeextract" -Directory | Select-Object -First 1).FullName "$BinDir\node"

          Write-Host "Installing pnpm..."
          & "$BinDir\node\npm.cmd" install -g pnpm

          Write-Host "All binaries downloaded."

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxoid-windows-bins
          path: windows/bin/**
          retention-days: 7

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'alpha-0.4' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure pnpm
        run: pnpm config set network-concurrency 1

      - name: Install deps and build
        run: |
          cd fluxer_app
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxoid-frontend-dist
          path: fluxer_app/dist/**
          retention-days: 7

  package-windows:
    name: Package Windows Installer
    needs: [build-gateway-windows, download-bins-windows, build-frontend]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'alpha-0.4' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download gateway artifact
        uses: actions/download-artifact@v4
        with:
          name: fluxer-gateway-windows-x64
          path: windows/bin/fluxer_gateway

      - name: Download binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: fluxoid-windows-bins
          path: windows/bin

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: fluxoid-frontend-dist
          path: fluxer_app/dist

      - name: Copy meilisearch master key
        shell: pwsh
        run: Copy-Item dev\meilisearch_master_key windows\meilisearch_master_key

      - name: Install desktop deps
        working-directory: fluxer_desktop
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron main process
        working-directory: fluxer_desktop
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Package Windows installer
        working-directory: fluxer_desktop
        run: npx electron-builder --win --x64
        env:
          BUILD_CHANNEL: stable

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: fluxoid-windows-installer
          path: fluxer_desktop/dist-electron/*.exe
          retention-days: 30
