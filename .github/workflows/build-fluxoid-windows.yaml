name: build fluxoid windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or commit SHA)
        required: false
        default: alpha-0.4
        type: string

permissions:
  contents: write

jobs:
  build-gateway-windows:
    name: Build Gateway (Windows)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'alpha-0.4' }}

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'

      - name: Install rebar3
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $rebar3Rel = (Invoke-RestMethod -Headers @{Authorization="Bearer $env:GH_TOKEN"} "https://api.github.com/repos/erlang/rebar3/releases/latest").tag_name
          $rebar3Dir = "C:\rebar3"
          New-Item -ItemType Directory -Force -Path $rebar3Dir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/erlang/rebar3/releases/download/$rebar3Rel/rebar3" -OutFile "$rebar3Dir\rebar3" -UseBasicParsing
          Set-Content -Path "$rebar3Dir\rebar3.cmd" -Value "@escript %~dp0rebar3 %*"
          Add-Content -Path $env:GITHUB_PATH -Value $rebar3Dir
          Write-Host "rebar3 $rebar3Rel installed to $rebar3Dir"

      - name: Build gateway release
        working-directory: fluxer_gateway
        shell: pwsh
        run: |
          # Use pre-prepared Windows rebar config and Windows-specific compress module
          Copy-Item rebar.windows.config rebar.config -Force
          Copy-Item gateway_compress.windows.erl src/gateway/gateway_compress.erl -Force
          Copy-Item fluxer_gateway.app.src.windows src/fluxer_gateway.app.src -Force
          $env:REBAR_SKIP_PROJECT_PLUGINS = '1'
          if (Test-Path rebar.lock) { Remove-Item -Force rebar.lock }
          if (Test-Path _build) { Remove-Item -Recurse -Force _build }
          rebar3 as prod release

      - name: Upload gateway artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxer-gateway-windows-x64
          path: fluxer_gateway/_build/prod/rel/fluxer_gateway/**
          retention-days: 7

  download-bins-windows:
    name: Download Windows Binaries
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'alpha-0.4' }}

      - name: Download binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $BinDir = Join-Path (Get-Location) "windows\bin"
          New-Item -ItemType Directory -Force -Path $BinDir | Out-Null

          Write-Host "Downloading Caddy..."
          $caddyRel = (Invoke-RestMethod -Headers @{Authorization="Bearer $env:GH_TOKEN"} "https://api.github.com/repos/caddyserver/caddy/releases/latest").tag_name
          $caddyVer = $caddyRel.TrimStart('v')
          Invoke-WebRequest -Uri "https://github.com/caddyserver/caddy/releases/download/$caddyRel/caddy_${caddyVer}_windows_amd64.zip" -OutFile "$env:TEMP\caddy.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\caddy.zip" -DestinationPath $BinDir -Force

          Write-Host "Downloading NATS..."
          $natsRel = (Invoke-RestMethod -Headers @{Authorization="Bearer $env:GH_TOKEN"} "https://api.github.com/repos/nats-io/nats-server/releases/latest").tag_name
          Invoke-WebRequest -Uri "https://github.com/nats-io/nats-server/releases/download/$natsRel/nats-server-$natsRel-windows-amd64.zip" -OutFile "$env:TEMP\nats.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\nats.zip" -DestinationPath "$env:TEMP\nats" -Force
          Copy-Item (Get-ChildItem "$env:TEMP\nats" -Filter "nats-server.exe" -Recurse | Select-Object -First 1).FullName (Join-Path $BinDir "nats-server.exe")

          Write-Host "Downloading Meilisearch..."
          $meiliRel = (Invoke-RestMethod -Headers @{Authorization="Bearer $env:GH_TOKEN"} "https://api.github.com/repos/meilisearch/meilisearch/releases/latest").tag_name
          Invoke-WebRequest -Uri "https://github.com/meilisearch/meilisearch/releases/download/$meiliRel/meilisearch-windows-amd64.exe" -OutFile (Join-Path $BinDir "meilisearch.exe") -UseBasicParsing

          Write-Host "Downloading LiveKit..."
          $livekitRel = (Invoke-RestMethod -Headers @{Authorization="Bearer $env:GH_TOKEN"} "https://api.github.com/repos/livekit/livekit/releases/latest").tag_name
          $livekitVer = $livekitRel.TrimStart('v')
          Invoke-WebRequest -Uri "https://github.com/livekit/livekit/releases/download/$livekitRel/livekit_${livekitVer}_windows_amd64.zip" -OutFile "$env:TEMP\livekit.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\livekit.zip" -DestinationPath "$env:TEMP\livekit" -Force
          Copy-Item (Get-ChildItem "$env:TEMP\livekit" -Filter "livekit-server.exe" -Recurse | Select-Object -First 1).FullName (Join-Path $BinDir "livekit-server.exe")

          Write-Host "Downloading Redis for Windows..."
          $redisRel = (Invoke-RestMethod -Headers @{Authorization="Bearer $env:GH_TOKEN"} "https://api.github.com/repos/tporadowski/redis/releases/latest").tag_name
          $redisVer = $redisRel.TrimStart('v')
          Invoke-WebRequest -Uri "https://github.com/tporadowski/redis/releases/download/$redisRel/Redis-x64-${redisVer}.zip" -OutFile "$env:TEMP\redis.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\redis.zip" -DestinationPath "$env:TEMP\redis" -Force
          Copy-Item (Get-ChildItem "$env:TEMP\redis" -Filter "redis-server.exe" -Recurse | Select-Object -First 1).FullName (Join-Path $BinDir "valkey-server.exe")

          Write-Host "Downloading Node.js..."
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.11.0/node-v20.11.0-win-x64.zip" -OutFile "$env:TEMP\node.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\node.zip" -DestinationPath "$env:TEMP\nodeextract" -Force
          $nodeDir = Get-ChildItem "$env:TEMP\nodeextract" -Directory | Select-Object -First 1
          $nodeBinDir = Join-Path $BinDir "node"
          Copy-Item -Recurse -Force $nodeDir.FullName $nodeBinDir
          $npmExe = Get-ChildItem $nodeBinDir -Filter "npm.cmd" -Recurse | Select-Object -First 1
          Write-Host "npm at: $($npmExe.FullName)"
          & $npmExe.FullName install -g pnpm

          Write-Host "All binaries downloaded."

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxoid-windows-bins
          path: windows/bin/**
          retention-days: 7

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'alpha-0.4' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create CI config
        run: |
          mkdir -p config
          cat > config/config.json << 'EOF'
          {
            "env": "development",
            "domain": {
              "base_domain": "localhost",
              "public_port": 48763,
              "public_scheme": "http",
              "gateway_endpoint": "wss://gateway.fluxer.app"
            },
            "app_public": {
              "client_id": "https://localhost",
              "redirect_uris": ["http://127.0.0.1:48763/callback"],
              "bootstrap_api_endpoint": "http://localhost:48763/api"
            },
            "database": {"backend": "sqlite", "sqlite_path": "./data/dev.db"},
            "internal": {"kv": "redis://127.0.0.1:6379/0", "kv_mode": "standalone"},
            "s3": {"access_key_id": "ci", "secret_access_key": "ci", "endpoint": "http://127.0.0.1:49319/s3"},
            "services": {
              "server": {"port": 49319, "host": "0.0.0.0"},
              "media_proxy": {"secret_key": "ci"},
              "admin": {"secret_key_base": "ci", "oauth_client_secret": "ci"},
              "marketing": {"enabled": false, "port": 49531, "host": "0.0.0.0", "secret_key_base": "ci"},
              "gateway": {"port": 49107, "admin_reload_secret": "ci", "media_proxy_endpoint": "http://127.0.0.1:49319/media", "logger_level": "debug"},
              "nats": {"core_url": "nats://127.0.0.1:4222", "jetstream_url": "nats://127.0.0.1:4223"}
            },
            "auth": {"sudo_mode_secret": "ci"}
          }
          EOF

      - name: Install deps and build
        env:
          FLUXER_CONFIG: ${{ github.workspace }}/config/config.json
        run: |
          cd fluxer_app
          pnpm install --no-frozen-lockfile
          pnpm lingui:compile
          pnpm build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxoid-frontend-dist
          path: fluxer_app/dist/**
          retention-days: 7

  package-windows:
    name: Package Windows Installer
    needs: [build-gateway-windows, download-bins-windows, build-frontend]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'alpha-0.4' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download gateway artifact
        uses: actions/download-artifact@v4
        with:
          name: fluxer-gateway-windows-x64
          path: windows/bin/fluxer_gateway

      - name: Download binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: fluxoid-windows-bins
          path: windows/bin

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: fluxoid-frontend-dist
          path: fluxer_app/dist

      - name: Copy meilisearch master key
        shell: pwsh
        run: Copy-Item dev\meilisearch_master_key windows\meilisearch_master_key

      - name: Install desktop deps
        working-directory: fluxer_desktop
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron main process
        working-directory: fluxer_desktop
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Package Windows installer
        working-directory: fluxer_desktop
        run: npx electron-builder --win --x64
        env:
          BUILD_CHANNEL: stable

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: fluxoid-windows-installer
          path: fluxer_desktop/dist-electron/*.exe
          retention-days: 30
